name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check src tests
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Runs the GitHub Action from this very commit, so a broken action.yml is
  # caught here instead of in somebody else's pipeline.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: diff gate that should pass
        uses: ./
        with:
          command: diff
          before: examples/prompt.txt
          prompt: examples/prompt_v2.txt
          data: examples/data.csv
          provider: mock
          fail-under: "0.80"
      - name: ablation report
        uses: ./
        with:
          command: ablate
          prompt: examples/prompt.txt
          data: examples/data.csv
          provider: mock
          subset-size: "30"
